<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ceylin ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* KART KISMI */
    .card {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
      z-index: 10;
      position: relative;
    }

    .img-box {
      width: 100%;
      max-height: 220px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 25px;
      font-weight: 600;
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 50px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #btn-yes {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }

    #btn-no {
      background-color: #dc3545;
      color: white;
      position: absolute;
      right: 20px;
      transition: all 0.2s ease-out;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
      touch-action: none;
    }

    /* KALP CANVAS KISMI */
    #heart-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- TEKLİF KARTI -->
  <div class="card" id="main-card">
    <div class="img-box">
      <!-- Görsel linkini değiştirebilirsin -->
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ODR3dmI3bnRnbDV0a2l4eXgzcTFoazI4eHNvMm9ydnR2ZHZ3ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/c6kJ9yMriBI1YKP3Vc/giphy.gif" alt="kedi">
    </div>
    <h2>Benimle Çıkar mısın Ceylin? ❤️</h2>
    <div class="btn-container" id="btn-box">
      <button id="btn-yes">Evet</button>
      <button id="btn-no">Hayır</button>
    </div>
  </div>

  <!-- NEON KALP EKRANI -->
  <div id="heart-screen">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    // --- 1. HAYIR BUTONUNU KAÇIRMA MANTIĞI ---
    const btnNo = document.getElementById('btn-no');
    const btnBox = document.getElementById('btn-box');

    function moveNoButton() {
      const boxRect = btnBox.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      // Ekran genişliğine göre güvenli kaçış mesafesi
      const maxX = window.innerWidth - btnRect.width - 20;
      const maxY = window.innerHeight - btnRect.height - 20;

      const randomX = Math.max(10, Math.floor(Math.random() * maxX));
      const randomY = Math.max(10, Math.floor(Math.random() * maxY));

      btnNo.style.position = 'fixed';
      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', function(e) {
      e.preventDefault();
      moveNoButton();
    });

    // --- 2. EVET BUTONU VE NEON KALP ANİMASYONU ---
    const btnYes = document.getElementById('btn-yes');
    const mainCard = document.getElementById('main-card');
    const heartScreen = document.getElementById('heart-screen');

    btnYes.addEventListener('click', function() {
      mainCard.style.display = 'none';
      heartScreen.style.display = 'block';
      startHeartAnimation();
    });

    // Videodaki tam matematiksel çizgi kalp algoritması
    function startHeartAnimation() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      let h = [];
      const HEIGHT = height;
      const WIDTH = width;

      // Formülasyon
      for (let i = 0; i < 200; i++) {
        let v = i * 0.1;
        let x = 16 * Math.pow(Math.sin(v), 3);
        let y = -(13 * Math.cos(v) - 5 * Math.cos(2 * v) - 2 * Math.cos(3 * v) - Math.cos(4 * v));
        h.push({ x: x, y: y });
      }

      let particles = [];
      for (let i = 0; i < 400; i++) {
        particles.push({
          x: (Math.random() - 0.5) * WIDTH,
          y: (Math.random() - 0.5) * HEIGHT,
          target: h[i % h.length],
          vx: 0,
          vy: 0,
          speed: Math.random() * 2 + 1,
          color: 'rgba(255, 40, 100, ' + (Math.random() * 0.7 + 0.3) + ')'
        });
      }

      function render() {
        ctx.fillStyle = 'rgba(5, 5, 8, 0.15)';
        ctx.fillRect(0, 0, width, height);

        const cx = width / 2;
        const cy = height / 2;
        const scale = Math.min(width, height) / 45; // iPhone ekranları için tam sığacak ölçek

        particles.forEach(p => {
          let tx = p.target.x * scale;
          let ty = p.target.y * scale;

          let dx = tx - p.x;
          let dy = ty - p.y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist > 1) {
            p.vx += (dx / dist) * p.speed * 0.1;
            p.vy += (dy / dist) * p.speed * 0.1;
          }

          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.88;
          p.vy *= 0.88;

          ctx.beginPath();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 1.5;
          ctx.moveTo(cx + p.x - p.vx * 3, cy + p.y - p.vy * 3);
          ctx.lineTo(cx + p.x, cy + p.y);
          ctx.stroke();
        });

        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>
