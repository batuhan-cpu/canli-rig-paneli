<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceylin ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #050508;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="alx"></canvas>

  <script>
    window.requestAnimationFrame =
      window.requestAnimationFrame ||
      window.webkitRequestAnimationFrame ||
      window.mozRequestAnimationFrame ||
      window.oRequestAnimationFrame ||
      window.msRequestAnimationFrame ||
      function (callback) {
        window.setTimeout(callback, 1000 / 60);
      };

    let loaded = false;

    let init = function () {
      if (loaded) return;
      loaded = true;

      let canvas = document.getElementById("alx");
      let ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      let rand = Math.random;

      // Kalp denklemi noktaları
      let heartPosition = function (rad) {
        return [
          Math.pow(Math.sin(rad), 3),
          -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))
        ];
      };

      let scaleAndTranslate = function (pos, sx, sy, dx, dy) {
        return [dx + pos[0] * sx, dy + pos[1] * sy];
      };

      window.addEventListener("resize", function () {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        ctx.fillStyle = "#050508";
        ctx.fillRect(0, 0, width, height);
      });

      let traceCount = 50;
      let pointsOrigin = [];
      let dr = 0.1;

      for (let i = 0; i < Math.PI * 2; i += dr) {
        pointsOrigin.push(scaleAndTranslate(heartPosition(i), 15, 13, 0, 0));
      }
      for (let i = 0; i < Math.PI * 2; i += dr) {
        pointsOrigin.push(scaleAndTranslate(heartPosition(i), 9, 7.5, 0, 0));
      }
      for (let i = 0; i < Math.PI * 2; i += dr) {
        pointsOrigin.push(scaleAndTranslate(heartPosition(i), 5, 4, 0, 0));
      }

      let heartPointsCount = pointsOrigin.length;
      let targetPoints = [];

      let pulse = function (kx, ky) {
        for (let i = 0; i < pointsOrigin.length; i++) {
          targetPoints[i] = [];
          targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
          targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
        }
      };

      let e = [];
      for (let i = 0; i < heartPointsCount; i++) {
        let x = rand() * width;
        let y = rand() * height;
        e[i] = {
          vx: 0,
          vy: 0,
          R: 2,
          speed: rand() + 2,
          q: ~~(rand() * heartPointsCount),
          D: 2 * (i % 2) - 1,
          force: 0.2 * rand() + 0.7,
          f: "hsla(340, 100%, " + ~~(60 * rand() + 20) + "%, 0.3)",
          trace: []
        };
        for (let k = 0; k < traceCount; k++) e[i].trace[k] = { x: x, y: y };
      }

      let config = {
        traceK: 0.4,
        timeDelta: 0.01
      };

      let time = 0;

      let loop = function () {
        let unpaused = time;
        time += config.timeDelta;

        // Atma efekti (Pulse)
        let k = -Math.cos(time);
        pulse((1 + k) * 0.5 + 0.5, (1 + k) * 0.5 + 0.5);

        ctx.fillStyle = "rgba(5, 5, 8, 0.1)";
        ctx.fillRect(0, 0, width, height);

        for (let i = e.length; i--; ) {
          let u = e[i];
          let q = targetPoints[u.q];
          let dx = u.trace[0].x - q[0];
          let dy = u.trace[0].y - q[1];
          let length = Math.sqrt(dx * dx + dy * dy);

          if (10 > length) {
            if (0.95 < rand()) {
              u.q = ~~(rand() * heartPointsCount);
            } else {
              if (0.99 < rand()) {
                u.D *= -1;
              }
              u.q += u.D;
              u.q %= heartPointsCount;
              if (0 > u.q) {
                u.q += heartPointsCount;
              }
            }
          }

          u.vx += (-dx / length) * u.speed;
          u.vy += (-dy / length) * u.speed;

          u.trace[0].x += u.vx;
          u.trace[0].y += u.vy;

          u.vx *= u.force;
          u.vy *= u.force;

          for (let k = 0; k < u.trace.length - 1; ) {
            let T = u.trace[k];
            let N = u.trace[++k];
            N.x -= config.traceK * (N.x - T.x);
            N.y -= config.traceK * (N.y - T.y);
          }

          ctx.fillStyle = u.f;
          for (let k = 0; k < u.trace.length; k++) {
            ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
          }
        }

        window.requestAnimationFrame(loop, canvas);
      };

      loop();
    };

    let s = document.readyState;
    if (s === "complete" || s === "loaded" || s === "interactive") {
      init();
    } else {
      document.addEventListener("DOMContentLoaded", init, false);
    }
  </script>
</body>
</html>
