<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ceylin ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* TEKLİF KARTI */
    .card {
      background: rgba(18, 18, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      padding: 40px 24px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      width: 90%;
      max-width: 420px;
      z-index: 10;
      position: relative;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 35px;
      font-weight: 600;
      line-height: 1.5;
      color: #f0f0f0;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
      position: relative;
    }

    button {
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #btn-yes {
      padding: 16px 36px;
      font-size: 1.25rem;
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 20px rgba(40, 167, 69, 0.6);
      z-index: 999;
      transform-origin: center;
    }

    #btn-no {
      padding: 16px 28px;
      font-size: 1.1rem;
      background-color: #dc3545;
      color: white;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.5);
      z-index: 1000;
      transform-origin: center;
    }

    /* VİDEODAKİ NEON KALP EKRANI */
    #heart-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100000;
      background: #000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Videodaki Neon Kalp SVG Efekti */
    .neon-heart {
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 0 12px #ff0055) drop-shadow(0 0 30px #ff0055) drop-shadow(0 0 60px #ff0055);
      animation: pulse 1.2s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.98);
        filter: drop-shadow(0 0 10px #ff0055) drop-shadow(0 0 25px #ff0055);
      }
      100% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 18px #ff0055) drop-shadow(0 0 45px #ff0055) drop-shadow(0 0 75px #ff0055);
      }
    }
  </style>
</head>
<body>

  <!-- TEKLİF KARTI -->
  <div class="card" id="main-card">
    <h2>Beni sevdin mi sevmedin mi orasını bilmem, benimle artık canım cicim aylarına geçmeye ne dersin? Benimle çıkar mısın? ❤️</h2>
    <div class="btn-container" id="btn-box">
      <button id="btn-yes">Evet</button>
      <button id="btn-no">Hayır</button>
    </div>
  </div>

  <!-- VİDEODAKİ BİREBİR NEON KALP GÖRSELİ -->
  <div id="heart-screen">
    <svg class="neon-heart" viewBox="0 0 32 32">
      <path fill="#ff0055" d="M16 28.5 C15.4 28.5 14.8 28.2 14.4 27.8 C9.2 22.8 2 15.8 2 9.5 C2 5.4 5.4 2 9.5 2 C12.2 2 14.7 3.4 16 5.6 C17.3 3.4 19.8 2 22.5 2 C26.6 2 30 5.4 30 9.5 C30 15.8 22.8 22.8 17.6 27.8 C17.2 28.2 16.6 28.5 16 28.5 Z"/>
    </svg>
  </div>

  <script>
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const mainCard = document.getElementById('main-card');
    const heartScreen = document.getElementById('heart-screen');

    let clickCount = 0;

    function handleNoClick(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      clickCount++;

      // 1. Evet butonu her tıklamada ekranı kaplayacak kadar devasa büyür
      let yesScale = 1 + (clickCount * 0.20);
      btnYes.style.transform = `scale(${yesScale})`;

      // 2. Hayır butonu gittikçe küçülür
      let noScale = Math.max(0.2, 1 - (clickCount * 0.19));
      btnNo.style.transform = `scale(${noScale})`;

      // 3. Hayır butonu ekran boşluklarında rastgele yer değiştirir
      const randomX = (Math.random() - 0.5) * 160;
      const randomY = (Math.random() - 0.5) * 100;
      btnNo.style.position = 'relative';
      btnNo.style.left = `${randomX}px`;
      btnNo.style.top = `${randomY}px`;

      // Çok küçüldüğünde hayır butonunu tamamen gizle
      if (clickCount >= 6) {
        btnNo.style.display = 'none';
      }
    }

    btnNo.addEventListener('click', handleNoClick);
    btnNo.addEventListener('touchstart', handleNoClick, { passive: false });

    // Evet butonuna basıldığında kart kaybolur ve videodaki neon kalp görseli açılır
    btnYes.addEventListener('click', function() {
      mainCard.style.display = 'none';
      heartScreen.style.display = 'flex';
    });
  </script>
</body>
</html>
