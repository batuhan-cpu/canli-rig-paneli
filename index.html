<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ceylin ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* KART KISMI */
    .card {
      background: rgba(15, 15, 25, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 30px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      width: 90%;
      max-width: 420px;
      z-index: 10;
      position: relative;
    }

    .img-box {
      width: 100%;
      height: 200px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 25px;
      font-weight: 600;
      line-height: 1.4;
      color: #eaeaea;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #btn-yes {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.5);
      z-index: 2;
    }

    #btn-no {
      background-color: #dc3545;
      color: white;
      position: absolute;
      right: 20px;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.5);
      transition: top 0.1s ease-out, left 0.1s ease-out;
      touch-action: none;
      z-index: 9999;
    }

    /* KALP CANVAS KISMI */
    #heart-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10000;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- TEKLİF KARTI -->
  <div class="card" id="main-card">
    <div class="img-box">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ODR3dmI3bnRnbDV0a2l4eXgzcTFoazI4eHNvMm9ydnR2ZHZ3ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/c6kJ9yMriBI1YKP3Vc/giphy.gif" alt="kedi">
    </div>
    <h2>Beni sevdin mi sevmedin mi orasını bilmem, benimle artık canım cicim aylarına geçmeye ne dersin? Benimle çıkar mısın? ❤️</h2>
    <div class="btn-container" id="btn-box">
      <button id="btn-yes">Evet</button>
      <button id="btn-no">Hayır</button>
    </div>
  </div>

  <!-- NEON KALP EKRANI -->
  <div id="heart-screen">
    <canvas id="alx"></canvas>
  </div>

  <script>
    // --- 1. ASLA EKRANDAN KAYBOLMAYAN HIZLI KAÇAN HAYIR BUTONU ---
    const btnNo = document.getElementById('btn-no');

    function moveNoButton(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      const btnRect = btnNo.getBoundingClientRect();
      const margin = 20;

      // Ekranın tam görünen sınırları içinde tutma garantisi
      const maxX = window.innerWidth - btnRect.width - margin;
      const maxY = window.innerHeight - btnRect.height - margin;

      const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
      const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

      btnNo.style.position = 'fixed';
      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
    btnNo.addEventListener('click', moveNoButton);

    // --- 2. EVET BUTONU VE VİDEODAKİ KODLARIN BİREBİR AYNISI ---
    const btnYes = document.getElementById('btn-yes');
    const mainCard = document.getElementById('main-card');
    const heartScreen = document.getElementById('heart-screen');

    btnYes.addEventListener('click', function() {
      mainCard.style.display = 'none';
      heartScreen.style.display = 'block';
      startVideoHeart();
    });

    function startVideoHeart() {
      window.requestAnimationFrame =
        window.requestAnimationFrame ||
        window.webkitRequestAnimationFrame ||
        window.mozRequestAnimationFrame ||
        function (cb) { window.setTimeout(cb, 1000 / 60); };

      let canvas = document.getElementById("alx");
      let ctx = canvas.getContext("2d");

      let WIDTH = canvas.width = window.innerWidth;
      let HEIGHT = canvas.height = window.innerHeight;

      window.addEventListener("resize", function () {
        WIDTH = canvas.width = window.innerWidth;
        HEIGHT = canvas.height = window.innerHeight;
      });

      // Videodaki VS Code ekranından birebir aktarılan h.push döngüleri
      let h = [];
      for (let i = 0; i < 210; i += 0.2) {
        h.push([
          WIDTH / 2 + 180 * Math.pow(Math.sin(i), 3),
          HEIGHT / 2 + 90 * -(15 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i)) / 15
        ]);
      }
      for (let i = 0; i < 210; i += 0.4) {
        h.push([
          WIDTH / 2 + 150 * Math.pow(Math.sin(i), 3),
          HEIGHT / 2 + 90 * -(15 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i)) / 15
        ]);
      }
      for (let i = 0; i < 210; i += 0.8) {
        h.push([
          WIDTH / 2 + 90 * Math.pow(Math.sin(i), 3),
          HEIGHT / 2 + 90 * -(15 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i)) / 15
        ]);
      }

      // Parçacıklar ve iz bırakan çizgi mantığı
      let particles = [];
      for (let i = 0; i < 600; i++) {
        let x = Math.random() * WIDTH;
        let y = Math.random() * HEIGHT;
        let v = ~~(Math.random() * h.length);
        particles.push({
          x: x,
          y: y,
          v: v,
          X: x,
          Y: y,
          S: Math.random() * 2 + 1,
          R: Math.random() + 0.5,
          color: "hsla(" + ~~(330 + Math.random() * 30) + ", 100%, " + ~~(40 + Math.random() * 30) + "%, 0.8)"
        });
      }

      function loop() {
        ctx.fillStyle = "rgba(0,0,0,0.08)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          let target = h[p.v];
          let dx = target[0] - p.x;
          let dy = target[1] - p.y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            p.v = ~~(Math.random() * h.length);
          }

          p.x += (dx / dist) * p.S * 2.5;
          p.y += (dy / dist) * p.S * 2.5;

          ctx.beginPath();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.R;
          ctx.moveTo(p.X, p.Y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();

          p.X = p.x;
          p.Y = p.y;
        }

        requestAnimationFrame(loop);
      }

      loop();
    }
  </script>
</body>
</html>
