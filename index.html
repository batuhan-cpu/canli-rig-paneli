<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceylin'e Özel ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
      transition: all 0.3s ease;
    }

    h1 {
      color: #2d3436;
      font-size: 1.4rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 50px;
      position: relative;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    #yesBtn {
      background-color: #00b894;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
    }

    #yesBtn:hover {
      transform: scale(1.05);
      background-color: #00a182;
    }

    #noBtn {
      background-color: #ff7675;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 118, 117, 0.3);
    }

    .sub-text {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #e17055;
      font-weight: 600;
      min-height: 20px;
    }

    /* Gizli Kısım (Kabul Edince Açılacak) */
    .result {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    .result img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff7675;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .result p {
      color: #2d3436;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <!-- Soru Ekranı -->
    <div id="questionSection">
      <h1>Ceylin, "Sen bir şeyler yapacan" demiştin ya... <br><br>Görüşmeyeli güvenini kazandım bence. Benimle sevgili olur musun? ❤️</h1>
      
      <div class="btn-container">
        <button id="yesBtn" onclick="acceptOffer()">Kabul Ediyorum ✨</button>
        <button id="noBtn" onclick="handleNo()">Hayır 🙄</button>
      </div>

      <div class="sub-text" id="subText"></div>
    </div>

    <!-- Kabul Edince Açılacak Ekran -->
    <div class="result" id="resultSection">
      <img src="foto.jpg" alt="Biz">
      <h1>Seni Çook Seviyorum! ❤️</h1>
      <p>Sonunda doğru butonu bulacağını biliyordum 😉<br>Seninle her anı paylaşmak ve daha çok tanımak için sabırsızlanıyorum!</p>
    </div>
  </div>

  <script>
    const noMessages = [
      "Emin misin?",
      "Bak 'bacısı olan erkekten olmaz' muhabbetini de kapattık ama!",
      "Tekrar düşün Bence...",
      "Boş yapma kabul et işte 😄",
      "Son kez soruyorum?",
      "İki kelimeyle tanıyamazsın, şans ver!",
      "Pişman olursun bak!",
      "I-ıh, kaçış yok!",
      "Son şansın!"
    ];

    let clickCount = 0;

    function handleNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const subText = document.getElementById('subText');

      if (clickCount < noMessages.length) {
        subText.innerText = noMessages[clickCount];
        
        // Hayır butonunu küçült
        let currentScale = 1 - (clickCount * 0.1);
        noBtn.style.transform = `scale(${Math.max(currentScale, 0.2)})`;

        // Evet butonunu hafif büyüt
        let yesScale = 1 + (clickCount * 0.08);
        yesBtn.style.transform = `scale(${yesScale})`;

        clickCount++;
      }

      // 8 kere tıklayınca Hayır butonu tamamen kaybolur
      if (clickCount >= noMessages.length) {
        noBtn.style.display = 'none';
        subText.innerText = "İşte bu kadar! Artık sadece 'Kabul Ediyorum' seçeneğin var 😉";
      }
    }

    function acceptOffer() {
      document.getElementById('questionSection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';

      // Konfeti Efekti
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
